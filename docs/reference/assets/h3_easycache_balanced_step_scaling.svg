<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <rect width="1100" height="720" fill="#10151d"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #dce7f3; }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #9fb2c7; }
    .panel { fill: #17212d; stroke: #34465a; stroke-width: 1; }
    .panel-title { font-size: 16px; font-weight: 650; }
