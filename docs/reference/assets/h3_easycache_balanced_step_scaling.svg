  <g fill="#56c7ff"><circle cx="110" cy="257" r="5"/><circle cx="240" cy="211" r="5"/><circle cx="370" cy="174" r="5"/><circle cx="500" cy="143" r="5"/></g>
  <text x="315" y="126" class="legend" fill="#ffb454">Workflow</text>
  <text x="315" y="146" class="legend" fill="#56c7ff">Sampling</text>

