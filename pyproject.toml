[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comfyui-weetodd-nodes"
version = "0.1.0"
description = "Experimental MLX-native MiniMax H3 nodes for ComfyUI on Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "wee-todd"}]
dependencies = [
  "mlx>=0.32.0",
  "mlx-vlm>=0.4.4",
  "numpy>=1.26",
  "pillow>=11",
  "safetensors>=0.4",
  "transformers>=4.57",
]

[project.optional-dependencies]
docs = ["PyYAML>=6.0"]
ltx = [
  "ltx-core-mlx @ git+https://github.com/dgrauet/ltx-2-mlx.git@e1838a855bfd1640135c424c96cb27a0c0ad150e#subdirectory=packages/ltx-core-mlx",
  "ltx-pipelines-mlx @ git+https://github.com/dgrauet/ltx-2-mlx.git@e1838a855bfd1640135c424c96cb27a0c0ad150e#subdirectory=packages/ltx-pipelines-mlx",
]

[project.urls]
Repository = "https://github.com/wee-todd/WeeTodd-Nodes"
Issues = "https://github.com/wee-todd/WeeTodd-Nodes/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wee_todd_nodes", "src/minimax_h3_mlx", "src/ltx23_mlx"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  "tests/test_chain_stitch.py",
  "tests/test_packing_parity.py",
  "tests/test_quant_roundtrip.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
